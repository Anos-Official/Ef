<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin to Play</title>
<style>
  :root{
    --ink:#12141c;
    --panel:#181b26;
    --panel-edge:#2a2f42;
    --gold:#f4b942;
    --gold-dim:#c8922e;
    --teal:#3fd6c4;
    --violet:#8a6bf0;
    --paper:#eee9de;
    --danger:#e2574c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 20%, #232838 0%, var(--ink) 60%);
    font-family: 'Courier New', ui-monospace, monospace;
    color:var(--paper);
    overflow:hidden;
    position:relative;
  }

  /* ambient ticket-booth marquee dots */
  .marquee{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: radial-gradient(circle, rgba(244,185,66,0.06) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding:32px;
    position:relative;
    z-index:1;
  }

  .eyebrow{
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--gold-dim);
    text-transform:uppercase;
  }

  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(28px, 5vw, 44px);
    margin:0;
    color:var(--paper);
    letter-spacing:0.01em;
    text-align:center;
  }
  h1 span{ color:var(--gold); font-style:normal; }

  .wheel-wrap{
    position:relative;
    width:min(78vw, 420px);
    aspect-ratio:1/1;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }

  .pointer{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-top:28px solid var(--gold);
    z-index:5;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
    border-radius:50%;
  }

  .hub{
    position:absolute;
    top:50%; left:50%;
    width:17%; height:17%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, #fff6df, var(--gold) 55%, var(--gold-dim) 100%);
    border-radius:50%;
    border:3px solid var(--ink);
    z-index:4;
  }

  .rim{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:6px solid var(--panel-edge);
    z-index:3;
    pointer-events:none;
  }

  button#spinBtn{
    appearance:none;
    border:none;
    cursor:pointer;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
    color:var(--ink);
    font-family:inherit;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    font-size:15px;
    padding:16px 46px;
    border-radius:999px;
    box-shadow: 0 6px 0 #8a611c, 0 10px 24px rgba(0,0,0,0.4);
    transition: transform 0.08s ease;
  }
  button#spinBtn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 #8a611c, 0 6px 14px rgba(0,0,0,0.4);
  }
  button#spinBtn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  .result{
    min-height:22px;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--teal);
    text-transform:uppercase;
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .result.show{ opacity:1; }

  /* ---- hidden admin panel ---- */
  .admin-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,7,11,0.82);
    backdrop-filter: blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .admin-overlay.open{ display:flex; }

  .admin-panel{
    width:min(92vw, 460px);
    max-height:86vh;
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .admin-panel h2{
    margin:0 0 4px;
    font-family:Georgia, serif;
    font-style:italic;
    font-size:20px;
    color:var(--gold);
  }
  .admin-panel .sub{
    font-size:11px;
    color:#7a8095;
    margin-bottom:18px;
    letter-spacing:0.04em;
  }
  .admin-section{
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px dashed var(--panel-edge);
  }
  .admin-section:last-of-type{ border-bottom:none; }
  .admin-section label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#9aa0b4;
    margin-bottom:8px;
  }
  .segment-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
  }
  .segment-row input[type="text"]{
    flex:1;
    background:#0f1119;
    border:1px solid var(--panel-edge);
    color:var(--paper);
    padding:8px 10px;
    border-radius:6px;
    font-family:inherit;
    font-size:13px;
  }
  .segment-row select{
    background:#0f1119;
    border:1px solid var(--panel-edge);
    color:var(--paper);
    padding:8px 6px;
    border-radius:6px;
    font-family:inherit;
    font-size:12px;
  }
  .segment-row button{
    background:none;
    border:1px solid var(--danger);
    color:var(--danger);
    width:30px; height:30px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  .admin-btn{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px dashed var(--panel-edge);
    background:none;
    color:var(--teal);
    font-family:inherit;
    font-size:12px;
    letter-spacing:0.05em;
    cursor:pointer;
    text-transform:uppercase;
  }
  .rig-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .rig-row select, .rig-row input[type="number"]{
    background:#0f1119;
    border:1px solid var(--panel-edge);
    color:var(--paper);
    padding:8px;
    border-radius:6px;
    font-family:inherit;
    font-size:13px;
  }
  .rig-row select{ flex:1.4; }
  .rig-row input[type="number"]{ width:70px; }
  .queue-preview{
    font-size:11px;
    color:#9aa0b4;
    background:#0f1119;
    border-radius:6px;
    padding:10px;
    min-height:18px;
    word-break:break-word;
    line-height:1.6;
  }
  .queue-preview .tag{
    display:inline-block;
    background:var(--panel-edge);
    color:var(--paper);
    padding:2px 7px;
    border-radius:4px;
    margin:2px 3px 2px 0;
    font-size:11px;
  }
  .primary-btn{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:none;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    font-family:inherit;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:12px;
    cursor:pointer;
    margin-top:4px;
  }
  .ghost-btn{
    width:100%;
    padding:9px;
    border-radius:8px;
    border:1px solid var(--panel-edge);
    background:none;
    color:#9aa0b4;
    font-family:inherit;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:11px;
    cursor:pointer;
    margin-top:8px;
  }
  .admin-hint{
    font-size:10px;
    color:#565c72;
    text-align:center;
    margin-top:14px;
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; }
  }
</style>
</head>
<body>

<div class="marquee"></div>

<div class="stage">
  <div class="eyebrow">Round Ends At Midnight</div>
  <h1>Spin For Your <span>Next Move</span></h1>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="rim"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="hub"></div>
  </div>

  <button id="spinBtn">Spin</button>
  <div class="result" id="resultText">&nbsp;</div>
</div>

<!-- Hidden admin panel: opened only via keyboard shortcut, never linked in the UI -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <h2>Wheel Config</h2>
    <div class="sub">Not linked anywhere in the UI. Opened with Ctrl+Alt+W.</div>

    <div class="admin-section">
      <label>Segments</label>
      <div id="segmentList"></div>
      <button class="admin-btn" id="addSegmentBtn">+ Add Segment</button>
    </div>

    <div class="admin-section">
      <label>Force Outcomes (consumed in order, then reverts to fair random)</label>
      <div class="rig-row">
        <select id="rigCategorySelect"></select>
        <input type="number" id="rigCount" min="1" max="50" value="3" />
        <button class="admin-btn" id="addRigBtn" style="width:auto; padding:8px 14px;">Add</button>
      </div>
      <div class="queue-preview" id="queuePreview">Queue is empty — spins are fair random.</div>
      <button class="ghost-btn" id="clearQueueBtn">Clear Queue</button>
    </div>

    <button class="primary-btn" id="saveAdminBtn">Save & Apply</button>
    <button class="ghost-btn" id="closeAdminBtn">Close (Esc)</button>
    <div class="admin-hint">Config is saved locally in this browser (localStorage).</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     Data model
     Each segment: { id, label, category }
     category is a free-form tag ("lvl", "game", or anything you add)
     used to group segments for the "force N in a row" rig control.
  --------------------------------------------------------- */
  const DEFAULT_SEGMENTS = [
    { id: "s1", label: "Lvl 1",  category: "lvl"  },
    { id: "s2", label: "Nebula Run",  category: "game" },
    { id: "s3", label: "Lvl 2",  category: "lvl"  },
    { id: "s4", label: "Drift Kings", category: "game" },
    { id: "s5", label: "Lvl 3",  category: "lvl"  },
    { id: "s6", label: "Block Blitz", category: "game" },
    { id: "s7", label: "Lvl 4",  category: "lvl"  },
    { id: "s8", label: "Skyline Dash", category: "game" },
  ];

  const COLORS = ["#f4b942", "#3fd6c4", "#8a6bf0", "#e2574c", "#4f9dde", "#f47b6b", "#5fd18a", "#c88af0"];

  const STORAGE_KEY = "spinwheel_config_v1";

  function loadConfig(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { segments: DEFAULT_SEGMENTS.slice(), queue: [] };
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.segments) || parsed.segments.length < 2){
        return { segments: DEFAULT_SEGMENTS.slice(), queue: [] };
      }
      return { segments: parsed.segments, queue: Array.isArray(parsed.queue) ? parsed.queue : [] };
    }catch(e){
      return { segments: DEFAULT_SEGMENTS.slice(), queue: [] };
    }
  }

  function saveConfig(cfg){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  }

  let config = loadConfig();
  // queue: flat array of category strings, consumed front-to-back per spin.
  // e.g. addRig("lvl", 3) pushes ["lvl","lvl","lvl"] onto the queue.

  let currentRotation = 0; // radians, persisted across spins for continuity
  let spinning = false;

  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const size = canvas.width;
  const center = size / 2;
  const radius = size / 2 - 6;

  function drawWheel(){
    const segs = config.segments;
    const n = segs.length;
    const arc = (Math.PI * 2) / n;
    ctx.clearRect(0, 0, size, size);

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(currentRotation);

    for (let i = 0; i < n; i++){
      const start = i * arc;
      const end = start + arc;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "rgba(18,20,28,0.55)";
      ctx.lineWidth = 3;
      ctx.stroke();

      // label
      ctx.save();
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#12141c";
      ctx.font = "700 20px Georgia, serif";
      ctx.translate(radius - 22, 0);
      ctx.rotate(0);
      ctx.fillText(segs[i].label, 0, 6);
      ctx.restore();
    }
    ctx.restore();
  }

  drawWheel();

  /* ---------------------------------------------------------
     Outcome selection
  --------------------------------------------------------- */
  function pickTargetIndex(){
    const segs = config.segments;
    if (config.queue.length > 0){
      const category = config.queue.shift();
      const candidates = segs
        .map((s, i) => ({ s, i }))
        .filter(x => x.s.category === category);
      if (candidates.length > 0){
        const pick = candidates[Math.floor(Math.random() * candidates.length)];
        saveConfig(config);
        return pick.i;
      }
      // category no longer exists among segments — fall through to random
    }
    return Math.floor(Math.random() * segs.length);
  }

  function spin(){
    if (spinning) return;
    spinning = true;
    document.getElementById("spinBtn").disabled = true;
    document.getElementById("resultText").classList.remove("show");

    const segs = config.segments;
    const n = segs.length;
    const arc = (Math.PI * 2) / n;
    const targetIndex = pickTargetIndex();

    // angle so that the middle of targetIndex segment lands under the pointer (top, -90deg / -PI/2)
    const targetMid = targetIndex * arc + arc / 2;
    const pointerAngle = -Math.PI / 2;
    // jitter within the segment so it doesn't always land dead-center
    const jitter = (Math.random() - 0.5) * arc * 0.6;

    const fullSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full turns
    const desiredFinalRotation = pointerAngle - targetMid - jitter + Math.PI * 2 * fullSpins;

    const startRotation = currentRotation;
    // normalize distance forward
    let delta = desiredFinalRotation - (startRotation % (Math.PI * 2));
    while (delta < Math.PI * 2 * fullSpins) delta += Math.PI * 2;

    const duration = 4200 + Math.random() * 800;
    const startTime = performance.now();
    const from = startRotation;
    const to = startRotation + delta;

    function easeOutCubicQuint(t){
      // slow, weighted deceleration for a casino-wheel feel
      return 1 - Math.pow(1 - t, 4.2);
    }

    function frame(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = easeOutCubicQuint(t);
      currentRotation = from + (to - from) * eased;
      drawWheel();
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        currentRotation = to % (Math.PI * 2);
        drawWheel();
        spinning = false;
        document.getElementById("spinBtn").disabled = false;
        const resultEl = document.getElementById("resultText");
        resultEl.textContent = "Landed: " + segs[targetIndex].label;
        resultEl.classList.add("show");
      }
    }
    requestAnimationFrame(frame);
  }

  document.getElementById("spinBtn").addEventListener("click", spin);

  /* ---------------------------------------------------------
     Hidden admin panel
     Opens only via Ctrl+Alt+W — no visible button, link, or
     hint anywhere in the normal page UI.
  --------------------------------------------------------- */
  const overlay = document.getElementById("adminOverlay");
  const segmentListEl = document.getElementById("segmentList");
  const rigCategorySelect = document.getElementById("rigCategorySelect");
  const queuePreview = document.getElementById("queuePreview");

  // working copy edited inside the panel; only committed on Save & Apply
  let draft = null;

  function openAdmin(){
    draft = JSON.parse(JSON.stringify(config));
    renderSegmentList();
    renderRigOptions();
    renderQueuePreview();
    overlay.classList.add("open");
  }
  function closeAdmin(){
    overlay.classList.remove("open");
  }

  function renderSegmentList(){
    segmentListEl.innerHTML = "";
    draft.segments.forEach((seg, idx) => {
      const row = document.createElement("div");
      row.className = "segment-row";

      const labelInput = document.createElement("input");
      labelInput.type = "text";
      labelInput.value = seg.label;
      labelInput.placeholder = "Label";
      labelInput.addEventListener("input", () => { seg.label = labelInput.value; });

      const catInput = document.createElement("input");
      catInput.type = "text";
      catInput.value = seg.category;
      catInput.placeholder = "category";
      catInput.style.width = "90px";
      catInput.style.flex = "0 0 90px";
      catInput.className = "";
      catInput.style.background = "#0f1119";
      catInput.style.border = "1px solid var(--panel-edge)";
      catInput.style.color = "var(--paper)";
      catInput.style.padding = "8px 10px";
      catInput.style.borderRadius = "6px";
      catInput.style.fontFamily = "inherit";
      catInput.style.fontSize = "13px";
      catInput.addEventListener("input", () => {
        seg.category = catInput.value.trim() || "misc";
        renderRigOptions();
      });

      const delBtn = document.createElement("button");
      delBtn.textContent = "×";
      delBtn.title = "Remove segment";
      delBtn.addEventListener("click", () => {
        if (draft.segments.length <= 2) return; // keep at least 2 segments
        draft.segments.splice(idx, 1);
        renderSegmentList();
        renderRigOptions();
      });

      row.appendChild(labelInput);
      row.appendChild(catInput);
      row.appendChild(delBtn);
      segmentListEl.appendChild(row);
    });
  }

  function renderRigOptions(){
    const categories = Array.from(new Set(draft.segments.map(s => s.category)));
    rigCategorySelect.innerHTML = "";
    categories.forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      rigCategorySelect.appendChild(opt);
    });
  }

  function renderQueuePreview(){
    if (draft.queue.length === 0){
      queuePreview.textContent = "Queue is empty — spins are fair random.";
      return;
    }
    queuePreview.innerHTML = draft.queue
      .map((cat, i) => `<span class="tag">${i + 1}. ${cat}</span>`)
      .join("");
  }

  document.getElementById("addSegmentBtn").addEventListener("click", () => {
    const idNum = draft.segments.length + 1;
    draft.segments.push({ id: "s" + Date.now() + idNum, label: "New Entry", category: "misc" });
    renderSegmentList();
    renderRigOptions();
  });

  document.getElementById("addRigBtn").addEventListener("click", () => {
    const cat = rigCategorySelect.value;
    const count = Math.max(1, Math.min(50, parseInt(document.getElementById("rigCount").value, 10) || 1));
    if (!cat) return;
    for (let i = 0; i < count; i++) draft.queue.push(cat);
    renderQueuePreview();
  });

  document.getElementById("clearQueueBtn").addEventListener("click", () => {
    draft.queue = [];
    renderQueuePreview();
  });

  document.getElementById("saveAdminBtn").addEventListener("click", () => {
    config = draft;
    saveConfig(config);
    drawWheel();
    closeAdmin();
  });

  document.getElementById("closeAdminBtn").addEventListener("click", closeAdmin);

  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeAdmin();
  });

  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.altKey && (e.key === "w" || e.key === "W")){
      e.preventDefault();
      if (overlay.classList.contains("open")) closeAdmin(); else openAdmin();
    } else if (e.key === "Escape" && overlay.classList.contains("open")){
      closeAdmin();
    }
  });

})();
</script>

</body>
</html>
